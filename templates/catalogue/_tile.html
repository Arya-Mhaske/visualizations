{% with t=item.tile %}
{% if t.kind == "tool" %}
<a class="nb-tile{% if not item.is_live %} is-soon{% endif %}" href="{{ item.url }}">
  <h2 class="nb-tile__title">{{ t.title }}</h2>
</a>
{% else %}
<a class="nb-tile nb-tile--{{ item.accent }}" href="{{ item.url }}">
  <span class="nb-tile__num">{{ item.num|stringformat:"02d" }}</span>
  <h2 class="nb-tile__title">{{ t.title }}</h2>
  <span class="nb-tile__meta">{{ item.count }}</span>
</a>
{% endif %}
{% endwith %}
