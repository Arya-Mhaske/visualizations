<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="MuskMelon">
  <!-- Original mark: a half muskmelon slice. Colours mirror brutal.css tokens (orange, green, ink, paper);
       an SVG favicon cannot read CSS variables, so this file is the one allowed exception to the no-hex rule. -->
